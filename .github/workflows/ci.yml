name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_SUPABASE_URL/ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are
    # deliberately absent here: they're set to the real local stack's own
    # values by "Export local Supabase credentials" below, once
    # `supabase start` has one running -- not to a placeholder. Stripe and
    # Typesense remain placeholders (a syntactically valid but unreachable
    # config, not real credentials) -- this repo has no CI-provisioned
    # Stripe test account or Typesense service, so specs that need either
    # still hit their real fetch-failure/no-data skip paths rather than
    # crashing on a missing env var. Swap these for real secrets (Settings >
    # Secrets and variables > Actions) to close that remaining gap.
    env:
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TYPESENSE_HOST: localhost
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ci-placeholder-typesense-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database (apply every migration + seed.sql fresh)
        run: supabase db reset

      - name: Database tests (pgTAP + RLS regressions)
        # Blocking: this is the gap the 2026-07-26 security re-audit called
        # out directly (item 10) -- despite supabase/tests/database having
        # real pgTAP coverage for the RPC trust boundary (guest-cart
        # ownership, the inventory oversell check, atomic order creation),
        # none of it ran in CI, so a regression like the parameter-shadowing
        # bugs those tests now pin could land silently.
        run: supabase test db

      - name: Export local Supabase credentials
        # The stack `supabase start` + `db reset` just built is a real,
        # fully-migrated-and-seeded backend -- not a placeholder -- so the
        # Build/E2E steps below get genuine data instead of every request
        # failing closed against an unreachable host.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm run build

      - name: Check for leaked secrets in client bundle
        run: pnpm --filter web run check:secrets

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        # Blocking now that the app runs against the real local Supabase
        # stack above instead of an unreachable placeholder: specs that
        # gracefully skip on "no catalogue data seeded" (see e.g.
        # sku-selector.spec.ts) now find the demo catalogue seed migrations
        # actually applied, so they run their real assertions rather than
        # skipping. Stripe- and staff-session-dependent paths (e.g.
        # fulfillment-flow.spec.ts) still fall back to their own graceful
        # skip guards, since this job has no real Stripe test account or a
        # logged-in staff session to offer them -- that remains the
        # documented gap, not a reason to keep the whole suite non-blocking.
        run: pnpm exec playwright test
